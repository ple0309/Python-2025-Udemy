<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website</title>
</head>
<body>
    <h1>Hello World!</h1>
    <h2>{{ 5*6 }}</h2>
    <h3>Random Number: {{ num }}</h3>
    <!-- Using url_for() to get the url with function name inside like parameter.-->
    <a href="{{ url_for('get_blog', num=3)}}">Go to Blog</a>
</body>
<footer>
    <p>Copyright {{ CURRENT_YEAR }}. Built by {{ MY_NAME }}</p>
</footer>
</html>
